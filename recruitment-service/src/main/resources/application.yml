spring:
  application:
    name: recruitment-service
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/recruitment_db
    username: recruitment_user
    password: changeme
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/recruitment_db
    user: recruitment_user
    password: changeme
    schemas: public
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.springframework.r2dbc.core: DEBUG
