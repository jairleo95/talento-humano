spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/identity_db
    username: identity_user
    password: changeme
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5434/identity_db
    user: identity_user
    password: changeme
    schemas: public

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0

app:
  jwt:
    secret: ${JWT_SECRET:d94a1f5c8e7b03a2f91c6d4e82b5073a9f0e1d2c3b4a59687a8b9c0d1e2f3a4b5c}
    expiration: ${JWT_EXPIRATION:1h}

logging:
  level:
    root: INFO
    org.springframework.r2dbc.core: DEBUG
