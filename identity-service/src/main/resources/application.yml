spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5434/identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5434/identity_db}
    user: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD}
    schemas: public

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}

logging:
  level:
    root: INFO
    org.springframework.r2dbc.core: DEBUG
