spring:
  application:
    name: contract-service
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5434/contract_db}
    username: ${DB_USERNAME:contract_user}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5434/contract_db}
    user: ${DB_USERNAME:contract_user}
    password: ${DB_PASSWORD}
    schemas: public

server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
