spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - RemoveResponseHeader=Server
      routes:
        - id: legacy-gth
          uri: http://localhost:8080
          predicates:
            - Path=/gth/**
          filters:
            - StripPrefix=1
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: recruitment-service
          uri: http://localhost:8082
          predicates:
            - Path=/recruitment/**
          filters:
            - StripPrefix=1
        - id: contract-service
          uri: http://localhost:8083
          predicates:
            - Path=/contract/**
          filters:
            - StripPrefix=1

server:
  port: 8085

app:
  jwt:
    secret: ${JWT_SECRET:d94a1f5c8e7b03a2f91c6d4e82b5073a9f0e1d2c3b4a59687a8b9c0d1e2f3a4b5c}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
