spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - RemoveResponseHeader=Server
      routes:
        - id: legacy-gth
          uri: http://localhost:8080
          predicates:
            - Path=/gth/**
          filters:
            - StripPrefix=1
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: recruitment-service
          uri: http://localhost:8082
          predicates:
            - Path=/recruitment/**
          filters:
            - StripPrefix=1
        - id: contract-service
          uri: http://localhost:8083
          predicates:
            - Path=/contracts/**
          filters:
            - StripPrefix=1

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
