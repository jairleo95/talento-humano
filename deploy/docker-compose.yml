# ---- Docker Compose para Talento Humano ----
# Uso: docker compose up -d
# Frontend en http://localhost:4200 (dev) o http://localhost (prod con nginx)

services:

  # --- PostgreSQL ---
  postgres:
    image: postgres:16
    container_name: talento-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # --- Servicios backend (opcional — se pueden correr localmente con java -jar) ---
